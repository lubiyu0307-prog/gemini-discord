name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
        
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Check version sync
        run: npm run version:check

      - name: Build
        run: npm run build

      - name: Verify generated dist is current
        run: git diff --exit-code -- dist/server.cjs dist/daemon.cjs dist/setup.cjs dist/install-service.cjs

      - name: Test
        run: npm test
